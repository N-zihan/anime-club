{% extends "base.html" %}
{% block title %}番剧动态{% endblock %}
{% block content %}

<h2>番剧动态</h2>
<p style="color: var(--text-secondary); font-size:0.9rem; margin-bottom:20px;">
    数据来源：ANN / MAL / Crunchyroll / Comic Book 等多家媒体
</p>

<div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
    <button class="filter-btn active" data-tag=""
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:#1e2a3a; color:white; cursor:pointer; font-size:0.85rem;">全部</button>
    <button class="filter-btn" data-tag="anime"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">动画</button>
    <button class="filter-btn" data-tag="manga"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">漫画</button>
    <button class="filter-btn" data-tag="industry"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">业界</button>
    <button class="filter-btn" data-tag="official"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">官方</button>
</div>

<div id="newsStatus" style="text-align:center; color: var(--text-muted); padding:40px 0; display:none;"></div>
<div id="newsFeed"></div>

<button id="loadMoreBtn" style="display:none; width:100%; padding:14px; margin-top:20px; background:var(--bg-code); border:1px solid var(--border-color); border-radius:12px; cursor:pointer; color:var(--text-primary); font-size:0.9rem;">加载更多</button>

<style>
.news-item {
    display: flex;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--border-color);
    align-items: flex-start;
}
.news-item:last-child { border-bottom: none; }
.news-thumb {
    width: 120px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--bg-code);
    flex-shrink: 0;
}
.news-body { flex: 1; min-width: 0; }
.news-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}
.news-source {
    background: var(--bg-code);
    padding: 2px 10px;
    border-radius: 10px;
    color: var(--text-secondary);
    font-weight: 500;
}
.news-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 4px 0 8px 0;
    line-height: 1.5;
}
.news-title a {
    color: var(--text-primary);
    text-decoration: none;
    transition: color 0.15s;
}
.news-title a:hover { color: #4a90d9; }
.news-excerpt {
    font-size: 0.88rem;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
@media (max-width: 600px) {
    .news-thumb { width: 90px; height: 60px; }
    .news-title { font-size: 0.95rem; }
}
</style>

<script>
(function () {
    const feed = document.getElementById('newsFeed');
    const statusEl = document.getElementById('newsStatus');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    const SOURCE_NAMES = {
        'MyAnimeList': 'MAL',
        'Anime News Network': 'ANN',
        'Crunchyroll': 'Crunchyroll',
        'Comic Book': 'ComicBook',
        'Anime Corner': 'Anime Corner',
        'Anime Herald': 'Anime Herald',
        'Otaku USA': 'Otaku USA',
    };

    let currentTag = '';
    let nextCursor = null;

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function formatDate(s) {
        if (!s) return '';
        try {
            const d = new Date(s);
            if (isNaN(d.getTime())) return s.slice(0, 10);
            const now = new Date();
            const diff = (now - d) / 1000;
            if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + ' 天前';
            return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric' });
        } catch (e) {
            return s.slice(0, 10);
        }
    }

    function thumbUrl(url) {
        if (!url) return '';
        // 通过图片 CDN 代理，解决部分图床国内访问慢的问题
        return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=240&h=160&fit=cover';
    }

    function itemHtml(a) {
        const title = escapeHtml(a.title || '无标题');
        const url = a.link || a.url || '#';
        const source = SOURCE_NAMES[a.source] || a.source || '';
        const date = formatDate(a.date || a.published_at);
        const excerpt = a.excerpt || a.summary || '';
        const img = a.image ? thumbUrl(a.image) : '';

        return '<div class="news-item">' +
            (img
                ? '<img class="news-thumb" src="' + escapeHtml(img) + '" loading="lazy" alt="">'
                : '') +
            '<div class="news-body">' +
                '<div class="news-meta">' +
                    (source ? '<span class="news-source">' + escapeHtml(source) + '</span>' : '') +
                    '<span>' + escapeHtml(date) + '</span>' +
                '</div>' +
                '<h3 class="news-title"><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + title + '</a></h3>' +
                (excerpt ? '<div class="news-excerpt">' + escapeHtml(excerpt) + '</div>' : '') +
            '</div>' +
        '</div>';
    }

    function render(articles, append) {
        if (!append) feed.innerHTML = '';
        if (!articles.length && !append) {
            statusEl.style.display = 'block';
            statusEl.textContent = '暂无新闻';
            return;
        }
        statusEl.style.display = 'none';
        feed.insertAdjacentHTML('beforeend', articles.map(itemHtml).join(''));
    }

    function load(tag, append) {
        if (!append) {
            currentTag = tag;
            nextCursor = null;
            filterBtns.forEach(function (b) {
                if (b.dataset.tag === tag) {
                    b.style.background = '#1e2a3a';
                    b.style.color = 'white';
                } else {
                    b.style.background = 'var(--bg-code)';
                    b.style.color = 'var(--text-primary)';
                }
            });
            feed.innerHTML = '';
            statusEl.style.display = 'block';
            statusEl.textContent = '加载中...';
            loadMoreBtn.style.display = 'none';
        } else {
            loadMoreBtn.textContent = '加载中...';
            loadMoreBtn.disabled = true;
        }

        let url = '/api/anime/news?limit=20';
        if (tag) url += '&tag=' + encodeURIComponent(tag);
        if (append && nextCursor) url += '&cursor=' + encodeURIComponent(nextCursor);

        fetch(url)
        .then(r => r.json())
        .then(data => {
            const articles = data.articles || [];
            render(articles, append);

            const meta = data.meta || {};
            nextCursor = meta.nextCursor || null;

            if (meta.hasMore && nextCursor) {
                loadMoreBtn.style.display = 'block';
                loadMoreBtn.textContent = '加载更多';
                loadMoreBtn.disabled = false;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        })
        .catch(() => {
            statusEl.style.display = 'block';
            statusEl.textContent = '加载失败，请稍后再试';
            loadMoreBtn.style.display = 'none';
        });
    }

    filterBtns.forEach(function (b) {
        b.addEventListener('click', function () {
            load(b.dataset.tag, false);
        });
    });

    loadMoreBtn.addEventListener('click', function () {
        load(currentTag, true);
    });

    load('', false);
})();
</script>

{% endblock %}
