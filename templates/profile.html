{% extends "base.html" %}
{% block title %}个人设置{% endblock %}
{% block content %}
<div class="card-form">
    <h2>个人设置</h2>

    <!-- 头像 -->
    <div style="text-align:center; margin-bottom:20px;">
        <img alt="头像" src="{{ url_for('user.get_avatar', user_id=user.id) }}"
             style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:2px solid #ddd;">
    </div>
    <form enctype="multipart/form-data" method="POST">
        <input name="action" type="hidden" value="change_avatar">
        <div class="form-group">
            <label>更换头像（支持 jpg/png/gif）：</label>
            <input accept="image/*" name="avatar" required type="file">
        </div>
        <button class="btn-primary" type="submit">上传头像</button>
    </form>

    <hr style="margin: 40px 0;">

    <!-- 修改用户名 -->
    <h3>修改用户名</h3>
    <form method="POST" onsubmit="return confirm('确定要修改用户名吗？修改后请重新登录。');">
        <input name="action" type="hidden" value="change_username">
        <div class="form-group">
            <label>新用户名：</label>
            <input maxlength="20" minlength="2" name="new_username" required type="text">
        </div>
        <button class="btn-primary" type="submit">修改用户名</button>
    </form>

    <hr style="margin: 40px 0;">

    <!-- 修改密码 -->
    <h3>修改密码</h3>
    <form method="POST" onsubmit="return confirm('确认修改密码？');">
        <input name="action" type="hidden" value="change_password">
        <div class="form-group">
            <label>原密码：</label>
            <input name="old_password" required type="password">
        </div>
        <div class="form-group">
            <label>新密码（至少6位）：</label>
            <input minlength="6" name="new_password" required type="password">
        </div>
        <div class="form-group">
            <label>确认新密码：</label>
            <input name="confirm_password" required type="password">
        </div>
        <button class="btn-primary" type="submit">修改密码</button>
    </form>
    <!-- 退出和注销 -->
    <hr style="margin: 40px 0;">

    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <a class="btn-primary" href="{{ url_for('auth.logout') }}" style="background: #4a6a7a;">退出登录</a>
        <form action="{{ url_for('auth.delete_account') }}" method="POST"
              onsubmit="return confirm('⚠️ 确定要永久注销账号吗？此操作不可撤销！');">
            <button style="background: #e74c3c; color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-size: 1rem; font-weight: 600;"
                    type="submit">
                注销账号
            </button>
        </form>
    </div>

    <p style="margin-top:20px;"><a href="{{ url_for('public.members') }}">返回社员列表</a></p>
</div>
{% endblock %}
