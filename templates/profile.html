{% extends "base.html" %}
{% block title %}个人设置{% endblock %}
{% block content %}

<h2>个人设置</h2>

<div style="display:grid; gap:20px; max-width:600px;">

    <!-- 头像 -->
    <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
        <h4>头像</h4>
        <img src="{{ url_for('user.get_avatar', user_id=user.id) }}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #e2e8f0;">
        <form method="POST" enctype="multipart/form-data" style="margin-top:10px;">
            <input type="hidden" name="action" value="change_avatar">
            <input type="file" name="avatar" accept="image/*" required>
            <button type="submit" style="padding:6px 16px; background:#1e2a3a; color:white; border:none; border-radius:6px; cursor:pointer;">上传</button>
        </form>
        <small style="color:#94a3b8;">支持 png, jpg, jpeg, gif，不超过2MB</small>
    </div>

    <!-- 用户名 -->
    <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
        <h4>用户名</h4>
        <p>当前：<strong>{{ user.username }}</strong></p>
        <form method="POST" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <input type="hidden" name="action" value="change_username">
            <input type="text" name="new_username" placeholder="新用户名" required style="padding:8px; border:1px solid #ccc; border-radius:6px;">
            <button type="submit" style="padding:6px 16px; background:#1e2a3a; color:white; border:none; border-radius:6px; cursor:pointer;">修改</button>
        </form>
    </div>

    <!-- 修改密码 -->
    <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
        <h4>修改密码</h4>
        <form method="POST">
            <input type="hidden" name="action" value="change_password">
            <div style="display:flex; flex-direction:column; gap:8px; max-width:300px;">
                <input type="password" name="old_password" placeholder="原密码" required style="padding:8px; border:1px solid #ccc; border-radius:6px;">
                <input type="password" name="new_password" placeholder="新密码（至少6位）" required style="padding:8px; border:1px solid #ccc; border-radius:6px;">
                <input type="password" name="confirm_password" placeholder="确认新密码" required style="padding:8px; border:1px solid #ccc; border-radius:6px;">
                <button type="submit" style="padding:6px 16px; background:#1e2a3a; color:white; border:none; border-radius:6px; cursor:pointer; align-self:flex-start;">修改密码</button>
            </div>
        </form>
    </div>

    <!-- 绑定邮箱 -->
    <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
        <h4>绑定邮箱</h4>
        <p style="color:#64748b; font-size:0.9rem;">用于修改密码，请填写常用QQ邮箱</p>

        {% if user.email %}
            <p>当前已绑定：<strong>{{ user.email }}</strong></p>
            <hr style="margin:12px 0;">
            <p style="font-size:0.9rem; color:#64748b;">更换邮箱：</p>
            <form method="POST" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <input type="hidden" name="action" value="send_email_code">
                <input type="email" name="email" placeholder="新邮箱" required style="padding:8px; border:1px solid #ccc; border-radius:6px;">
                <button type="submit" style="padding:6px 16px; background:#1e2a3a; color:white; border:none; border-radius:6px; cursor:pointer;">发送验证码</button>
            </form>
            <form method="POST" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;">
                <input type="hidden" name="action" value="verify_email_code">
                <input type="text" name="code" placeholder="6位验证码" required style="padding:8px; border:1px solid #ccc; border-radius:6px; width:150px;">
                <button type="submit" style="padding:6px 16px; background:#f39c12; color:white; border:none; border-radius:6px; cursor:pointer;">确认更换</button>
            </form>
        {% else %}
            <form method="POST" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <input type="hidden" name="action" value="send_email_code">
                <input type="email" name="email" placeholder="请输入你的QQ邮箱" required style="padding:8px; border:1px solid #ccc; border-radius:6px; min-width:200px;">
                <button type="submit" style="padding:6px 16px; background:#1e2a3a; color:white; border:none; border-radius:6px; cursor:pointer;">发送验证码</button>
            </form>
            <form method="POST" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;">
                <input type="hidden" name="action" value="verify_email_code">
                <input type="text" name="code" placeholder="6位验证码" required style="padding:8px; border:1px solid #ccc; border-radius:6px; width:150px;">
                <button type="submit" style="padding:6px 16px; background:#f39c12; color:white; border:none; border-radius:6px; cursor:pointer;">确认绑定</button>
            </form>
        {% endif %}
    </div>
    <!-- ========== 退出登录 / 注销账号 ========== -->
    <div style="margin-top:30px; padding:20px; background:#fef2f2; border-radius:12px; border:1px solid #fca5a5;">
        <h4 style="color:#991b1b;">账号操作</h4>
        <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:10px;">
            <a href="{{ url_for('auth.logout') }}" class="btn-primary" style="background:#64748b;">退出登录</a>
            <form method="POST" action="{{ url_for('auth.delete_account') }}" style="display:inline;" onsubmit="return confirm('确定要注销账号吗？此操作不可恢复！');">
                <button type="submit" style="padding:10px 24px; background:#dc2626; color:white; border:none; border-radius:40px; cursor:pointer; font-weight:600;">注销账号</button>
            </form>
        </div>
    </div>

</div>

{% endblock %}
