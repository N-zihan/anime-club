{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<h2>修改密码</h2>
<p style="color:#64748b;">输入你注册时填写的QQ号，重置链接将发至绑定的邮箱</p>
<form method="POST">
    <div style="max-width:300px;">
        <input type="text" name="qq" placeholder="请输入你的QQ号" required
               style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;">
        <button type="submit" class="btn-primary" style="width:100%;">发送重置链接</button>
    </div>
</form>
<p style="margin-top:16px;"><a href="{{ url_for('auth.login') }}">← 返回登录</a></p>
{% endblock %}
