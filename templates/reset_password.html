{% extends "base.html" %}
{% block title %}设置新密码{% endblock %}
{% block content %}
<h2>设置新密码</h2>
<form method="POST">
    <div style="max-width:300px;">
        <input type="password" name="password" placeholder="新密码（至少6位）" required
               style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;">
        <input type="password" name="confirm" placeholder="确认新密码" required
               style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;">
        <button type="submit" class="btn-primary" style="width:100%;">确认修改</button>
    </div>
</form>
{% endblock %}
