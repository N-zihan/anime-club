{% extends "base.html" %}
{% block title %}手动添加番剧资源{% endblock %}
{% block content %}
<div class="card-form">
    <h2>➕ 管理员手动添加资源</h2>
    <form method="POST">
        <div class="form-group">
            <label>标题：</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>描述（可选）：</label>
            <textarea name="description" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>网盘分享链接：</label>
            <input type="url" name="link" required>
        </div>
        <div class="form-group">
            <label>提取码（如有）：</label>
            <input type="text" name="extract_code">
        </div>
        <button type="submit" class="btn-primary">添加资源</button>
        <a href="{{ url_for('admin_anime_resources') }}" class="btn-cancel">返回管理</a>
    </form>
</div>
{% endblock %}
