{% extends "base.html" %}
{% block title %}创建赛事{% endblock %}
{% block content %}
<div class="card-form">
    <h2>创建赛事</h2>
    <form method="POST">
        <div class="form-group">
            <label>赛事标题</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>赛事描述</label>
            <textarea name="description" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label>性别分组</label>
            <select name="gender_mode">
                <option value="separate">男女分别进行（萌王+燃王）</option>
                <option value="mixed">混合进行</option>
            </select>
        </div>
        <div class="form-group">
            <label>比赛开始时间</label>
            <input type="datetime-local" name="open_at" required>
            <small style="color:#94a3b8; display:block; margin-top:4px;">
                系统将自动计算结束时间（开始时间 + 48天）
            </small>
        </div>
        <button class="btn-primary" type="submit">创建赛事</button>
        <a href="{{ url_for('admin.admin_contests_manage') }}">取消</a>
    </form>
</div>
{% endblock %}
