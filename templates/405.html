{% extends "base.html" %}
{% block title %}请求方法不允许{% endblock %}
{% block content %}
<div style="text-align: center; padding: 80px 20px;">
    <h1 style="font-size: 6rem; margin: 0; color: #f39c12;">405</h1>
    <h2 style="color: var(--text-secondary); margin-top: 0;">请求方式不对哦</h2>
    <p style="color: var(--text-muted); max-width: 500px; margin: 20px auto;">
        这个页面不支持你使用的请求方法，可能是你点了不该点的按钮。
    </p>
    <a class="btn-primary" href="{{ url_for('public.index') }}"
       style="display: inline-block; margin-top: 20px;">返回首页</a>
</div>
{% endblock %}
