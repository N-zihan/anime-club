{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="card-form">
    <h2>🔑 修改密码</h2>
    <form method="POST">
        <div class="form-group">
            <label>原密码：</label>
            <input name="old_password" required type="password">
        </div>
        <div class="form-group">
            <label>新密码：</label>
            <input name="new_password" required type="password">
        </div>
        <div class="form-group">
            <label>确认新密码：</label>
            <input name="confirm_password" required type="password">
        </div>
        <button class="btn-primary" type="submit">修改密码</button>
    </form>
    <p><a href="{{ url_for('profile') }}">返回个人设置</a></p>
</div>
{% endblock %}
