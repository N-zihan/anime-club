<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <title>南平一中动漫社 - {% block title %}{% endblock %}</title>
    <link href="{{ url_for('static', filename='favicon.ico') }}" rel="icon" type="image/jpeg">
</head>
<body>
<nav>
    <div class="nav-left">
        <a class="logo" href="/">南平一中动漫社</a>
    </div>
    <div class="nav-links">
        <a href="/home">首页</a>
        <a href="/about">社团介绍</a>
        <a href="/activities">活动</a>
        <a href="/gallery">珍贵历史图片</a>
        <a href="/board">留言板</a>
        <a href="/anime_resources">番剧链接</a>
        <a href="/members">社员名单</a>
    </div>
    <div class="nav-right">
        {% if session.user_id %}
        <a class="user-name" href="{{ url_for('profile') }}">{{ session.username }}</a>
        <a href="{{ url_for('logout') }}">退出</a>
        <form action="{{ url_for('delete_account') }}" class="inline-form" method="POST">
            <button class="delete-btn" onclick="return confirm('永久注销账号？')" type="submit">注销</button>
        </form>
        {% else %}
        <a href="{{ url_for('login') }}">登录</a>
        <a href="{{ url_for('register') }}">注册</a>
        {% endif %}
        {% if session.admin_logged_in %}
        <a href="{{ url_for('admin_dashboard') }}">管理</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© 南平一中动漫社 | 为爱发电</p>
</footer>
</body>
</html>
