<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="{{ url_for('static', filename='css/style.css') }}?v=4" rel="stylesheet">
    <title>南平一中动漫社 - {% block title %}{% endblock %}</title>
    <link href="{{ url_for('static', filename='favicon.ico') }}" rel="icon" type="image/x-icon"/>
</head>
<body>
<nav>
    <div class="nav-left">
        <a class="logo" href="/">南平一中动漫社</a>
    </div>
    <div class="nav-links">
        <a href="/home">首页</a>
        <a href="/about">社团介绍</a>
        <a href="/activities">活动</a>
        <a href="/gallery">珍贵历史图片</a>
        <a href="{{ url_for('public.board') }}">留言板</a>
        <a href="{{ url_for('public.anime_resources') }}">番剧链接</a>
        <a href="{{ url_for('public.members') }}">社员名单</a>
    </div>
    <div class="nav-right">
        {% if session.user_id %}
        <a class="user-name" href="{{ url_for('user.user_profile', username=session.username) }}">{{ session.username
            }}</a>
        <a href="{{ url_for('auth.logout') }}">退出</a>
        <form action="{{ url_for('auth.delete_account') }}" class="inline-form" method="POST">
            <button class="delete-btn" onclick="return confirm('永久注销账号？')" type="submit">注销</button>
        </form>
        {% else %}
        <a href="{{ url_for('auth.login') }}">登录</a>
        <a href="{{ url_for('auth.register') }}">注册</a>
        {% endif %}
        {% if is_admin %}
        <a href="{{ url_for('admin.admin_entry') }}">管理</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© 南平一中动漫社 | 为爱发电</p>
    <p style="font-size:0.7rem; color:#aaa; margin-top:4px;">{{ app_version }}</p>
</footer>
</body>
</html>
