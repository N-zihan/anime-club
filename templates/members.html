{% extends "base.html" %}
{% block title %}社员名单{% endblock %}
{% block content %}
<h2>👥 社员名单</h2>
<p class="member-count">共 {{ users|length }} 位成员</p>
<div class="members-grid">
    {% for user in users %}
    <div class="member-card">
        <div class="member-avatar">
            <img src="{{ url_for('static', filename='avatars/' + (user.avatar if user.avatar else 'default.png')) }}" alt="{{ user.username }}" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">
        </div>
        <div class="member-info">
        <h3>{{ user.username }}</h3>
        <p class="member-time">加入时间：{{ user.registered_at.strftime('%Y-%m-%d') }}</p>
        </div>
    </div>
    {% else %}
    <p>暂无社员，快来注册吧！</p>
    {% endfor %}
</div>
{% endblock %}
