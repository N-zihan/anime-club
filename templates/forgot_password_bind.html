{% extends "base.html" %}
{% block title %}绑定邮箱{% endblock %}
{% block content %}
<h2>绑定邮箱</h2>
<p style="color:#64748b;">该账号尚未绑定邮箱，请先绑定以便修改密码</p>

<form method="POST" action="{{ url_for('auth.forgot_bind_send_code') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; max-width:400px;">
    <input type="email" name="email" placeholder="你的QQ邮箱" required
           style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px; min-width:200px;">
    <button type="submit" style="padding:10px 16px; background:#1e2a3a; color:white; border:none; border-radius:6px; cursor:pointer;">发送验证码</button>
</form>

<form method="POST" action="{{ url_for('auth.forgot_bind_verify') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; max-width:400px; margin-top:10px;">
    <input type="text" name="code" placeholder="6位验证码" required
           style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px; min-width:150px;">
    <button type="submit" style="padding:10px 16px; background:#f39c12; color:white; border:none; border-radius:6px; cursor:pointer;">确认绑定</button>
</form>

<p style="margin-top:16px;"><a href="{{ url_for('auth.login') }}">← 返回登录</a></p>
{% endblock %}
