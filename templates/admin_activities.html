{% extends "base.html" %}
{% block title %}管理活动{% endblock %}
{% block content %}
<h2>📋 活动管理</h2>
<a href="{{ url_for('admin_activity_add') }}">➕ 添加新活动</a>
<table border="1" cellpadding="8" style="margin-top:20px; width:100%; border-collapse:collapse;">
    <thead>
        <tr><th>ID</th><th>标题</th><th>日期</th><th>内容</th><th>操作</th></tr>
    </thead>
    <tbody>
        {% for act in activities %}
        <tr>
            <td>{{ act.id }}</td>
            <td>{{ act.title }}</td>
            <td>{{ act.date }}</td>
            <td>{{ act.content[:50] }}{% if act.content|length > 50 %}...{% endif %}</td>
            <td>
                <a href="{{ url_for('admin_activity_edit', id=act.id) }}">编辑</a> |
                <a href="{{ url_for('admin_activity_delete', id=act.id) }}" onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
