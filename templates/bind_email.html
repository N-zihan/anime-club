{% extends "base.html" %}
{% block title %}绑定邮箱{% endblock %}
{% block content %}

<div style="max-width:480px; margin:0 auto; padding:20px 0;">

    <div style="background: var(--bg-card); padding:32px 28px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.08); border:1px solid var(--border-color);">
        <h2 style="margin-top:0; margin-bottom:8px; text-align:center; color: var(--text-primary);">绑定邮箱</h2>

        {% if user.email %}
        <div style="background: var(--bg-code); padding:12px 16px; border-radius:8px; margin-bottom:20px;">
            <p style="margin:0; font-size:0.85rem; color: var(--text-secondary);">当前已绑定</p>
            <p style="margin:4px 0 0 0; color: var(--text-primary); font-weight:600;">{{ user.email }}</p>
        </div>
        {% endif %}

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
            <input type="email" id="bindEmailInput" placeholder="请输入你的邮箱" required
                   style="flex:1; padding:12px; border:1px solid var(--border-color); border-radius:8px; font-size:15px; min-width:200px; box-sizing:border-box; background: var(--bg-input); color: var(--text-primary);">
            <button type="button" id="sendEmailCodeBtn"
                    style="padding:12px 18px; background:#1e2a3a; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; white-space:nowrap;">
                发送验证码
            </button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
            <input type="text" id="bindEmailCode" placeholder="6位验证码" required
                   style="flex:1; padding:12px; border:1px solid var(--border-color); border-radius:8px; font-size:15px; min-width:120px; box-sizing:border-box; background: var(--bg-input); color: var(--text-primary);">
            <button type="button" id="verifyEmailCodeBtn"
                    style="padding:12px 18px; background:#f39c12; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; white-space:nowrap;">
                确认绑定
            </button>
        </div>

        <div id="emailBindMessage" style="font-size:0.9rem; min-height:20px;"></div>

        <p style="margin-top:16px; text-align:center; font-size:14px;">
            <a href="{{ url_for('user.profile') }}" style="color: var(--text-muted);">← 返回个人设置</a>
        </p>
    </div>

</div>

<script>
(function() {
    const sendBtn = document.getElementById('sendEmailCodeBtn');
    const verifyBtn = document.getElementById('verifyEmailCodeBtn');
    const emailInput = document.getElementById('bindEmailInput');
    const codeInput = document.getElementById('bindEmailCode');
    const msgDiv = document.getElementById('emailBindMessage');
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;
    let countdown = 0;

    function showMsg(text, type) {
        msgDiv.textContent = text;
        msgDiv.style.color = type === 'success' ? '#16a34a' : '#dc2626';
    }

    // 发送验证码
    sendBtn.addEventListener('click', function() {
        const email = emailInput.value.trim();
        if (!email) { showMsg('请先填写邮箱', 'error'); return; }
        if (countdown > 0) return;

        sendBtn.disabled = true;
        sendBtn.textContent = '发送中...';

        fetch('/bind_email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken
            },
            body: 'action=send_email_code&email=' + encodeURIComponent(email)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                showMsg(data.error, 'error');
                sendBtn.disabled = false;
                sendBtn.textContent = '发送验证码';
                return;
            }
            showMsg(data.message, 'success');
            countdown = 60;
            const timer = setInterval(() => {
                countdown--;
                sendBtn.textContent = countdown + 's';
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendBtn.disabled = false;
                    sendBtn.textContent = '重新发送';
                }
            }, 1000);
        })
        .catch(() => {
            showMsg('网络错误，请重试', 'error');
            sendBtn.disabled = false;
            sendBtn.textContent = '发送验证码';
        });
    });

    // 确认绑定
    verifyBtn.addEventListener('click', function() {
        const code = codeInput.value.trim();
        if (!code) { showMsg('请填写验证码', 'error'); return; }

        verifyBtn.disabled = true;
        verifyBtn.textContent = '验证中...';

        fetch('/bind_email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken
            },
            body: 'action=verify_email_code&code=' + encodeURIComponent(code)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                showMsg(data.error, 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = '确认绑定';
                return;
            }
            showMsg(data.message + '，3 秒后返回...', 'success');
            setTimeout(() => {
                window.location.href = "{{ url_for('user.profile') }}";
            }, 1500);
        })
        .catch(() => {
            showMsg('网络错误，请重试', 'error');
            verifyBtn.disabled = false;
            verifyBtn.textContent = '确认绑定';
        });
    });
})();
</script>

{% endblock %}
