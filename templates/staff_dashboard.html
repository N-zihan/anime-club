{% extends "base.html" %}
{% block title %}运营管理面板{% endblock %}
{% block content %}
<div class="admin-header">
    <h2>运营管理面板</h2>
    <p style="color:#7f8c8d; font-size:0.9rem;">欢迎，运营成员！你拥有内容管理权限。</p>
</div>
<div class="card-grid">
    <a class="card" href="{{ url_for('admin.admin_activities') }}">
        <div class="card-icon">📅</div>
        <h3>活动管理</h3>
        <p>添加、编辑、删除社团活动</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_anime_resources') }}">
        <div class="card-icon">📦</div>
        <h3>番剧资源管理</h3>
        <p>审核社员推荐、手动添加资源</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_gallery') }}">
        <div class="card-icon">🖼️</div>
        <h3>照片墙管理</h3>
        <p>上传、删除历史照片</p>
    </a>
    <!-- 没有“用户管理”卡片 -->
</div>
<p style="margin-top:30px; color:#95a5a6; font-size:0.85rem;">如有疑问，请联系站长。</p>
{% endblock %}
