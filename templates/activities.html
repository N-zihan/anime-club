{% extends "base.html" %}
{% block title %}社团活动{% endblock %}
{% block content %}
<h2>📅 近期活动</h2>
<div class="activities-grid">
    {% for activity in activities %}
    <div class="activity-card">
        <div class="activity-date">
            {{ activity.date }}
        </div>
        <h3>{{ activity.title }}</h3>
        <p>{{ activity.content }}</p>
        <!-- 如果有图片字段，可以加 img -->
    </div>
    {% endfor %}
</div>
{% endblock %}
