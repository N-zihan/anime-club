{% extends "base.html" %}
{% block title %}社员注册{% endblock %}
{% block content %}
<div class="card-form">
    <h2>社团成员注册</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="form-group">
            <label>用户名：</label>
            <input name="username" pattern="[A-Za-z0-9_]{2,20}"
                   required
                   title="只允许字母、数字、下划线，长度2-20个字符"
                   type="text">
        </div>
        <div class="form-group">
            <label>QQ号：</label>
            <input name="qq" pattern="\d{5,12}" required title="请填写5-12位数字QQ号" type="text">
        </div>
        <div class="form-group">
            <label>社团QQ群号：</label>
            <input name="group" placeholder="（非社团成员禁止入内）" required type="text">
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input name="password" required type="password">
        </div>
        <button class="btn-primary" type="submit">注册</button>
    </form>
    <p>已有账号？<a href="{{ url_for('auth.login') }}">立即登录</a></p>
</div>
{% endblock %}
