{% extends "base.html" %}
{% block title %}{{ '编辑' if activity else '添加' }}活动{% endblock %}
{% block content %}
<h2>{{ '编辑活动' if activity else '添加新活动' }}</h2>
<form method="POST">
    <p>标题：<input name="title" required type="text" value="{{ activity.title if activity else '' }}"></p>
    <p>日期（YYYY-MM-DD）：<input name="date" placeholder="2025-12-31" required
                               type="text" value="{{ activity.date if activity else '' }}"></p>
    <p>内容：<br><textarea cols="50" name="content" required
                          rows="5">{{ activity.content if activity else '' }}</textarea></p>
    <p><input type="submit" value="保存"></p>
</form>
<a href="{{ url_for('admin_activities') }}">返回管理页</a>
{% endblock %}
