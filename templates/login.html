{% extends "base.html" %}
{% block title %}社员登录{% endblock %}
{% block content %}
<div class="card-form">
    <h2>社员登录</h2>
    <form method="POST">
        <div class="form-group">
            <label>用户名：</label>
            <input name="username" value="{{ username or '' }}" required type="text">
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input name="password" required type="password">
        </div>
        <button class="btn-primary" type="submit">登录</button>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </form>
    <p>还没注册？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
</div>
{% endblock %}
