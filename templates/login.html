{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
<h2>社员登录</h2>
<form method="POST">
    <div style="max-width:300px;">
        <input name="username" placeholder="用户名" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;" type="text"
               value="{{ username }}">
        <input name="password" placeholder="密码" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;"
               type="password">
        <button class="btn-primary" style="width:100%;" type="submit">登录</button>
    </div>
</form>
<p style="margin-top:10px;">
    还没有账号？<a href="{{ url_for('auth.register') }}">注册</a>
</p>
<p style="margin-top:6px;">
    <a href="{{ url_for('auth.forgot_password') }}">忘记密码？</a>
</p>
{% endblock %}
