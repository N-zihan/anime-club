{% extends "base.html" %}
{% block title %}站长管理面板{% endblock %}
{% block content %}
<div class="admin-header">
    <h2>站长管理面板</h2>
</div>
<div class="card-grid">
    <a class="card" href="{{ url_for('admin.admin_activities') }}">
        <div class="card-icon">📅</div>
        <h3>活动管理</h3>
        <p>添加、编辑、删除社团活动</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_anime_resources') }}">
        <div class="card-icon">📦</div>
        <h3>番剧资源管理</h3>
        <p>审核社员推荐、手动添加资源</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_gallery') }}">
        <div class="card-icon">🖼️</div>
        <h3>照片墙管理</h3>
        <p>上传、删除历史照片</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_users') }}">
        <div class="card-icon">👥</div>
        <h3>用户管理</h3>
        <p>查看、删除社员</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_messages') }}">
        <div class="card-icon">💬</div>
        <h3>留言管理</h3>
        <p>查看、删除留言及回复</p>
    </a>
    <a class="card" href="{{ url_for('admin.admin_contests_manage') }}">
        <div class="card-icon">🏆</div>
        <h3>赛事管理</h3>
        <p>创建、管理线上赛事</p>
    </a>
    <!-- 以后可以扩展更多管理功能 -->
</div>
{% endblock %}
