{% extends "base.html" %}
{% block title %}后台管理首页{% endblock %}
{% block content %}
<div class="admin-header">
    <h2>🛠️ 后台管理面板</h2>
</div>
<div class="card-grid">
    <a href="{{ url_for('admin_activities') }}" class="card">
        <div class="card-icon">📅</div>
        <h3>活动管理</h3>
        <p>添加、编辑、删除社团活动</p>
    </a>
    <a href="{{ url_for('admin_anime_resources') }}" class="card">
        <div class="card-icon">📦</div>
        <h3>番剧资源管理</h3>
        <p>审核社员推荐、手动添加资源</p>
    </a>
    <a href="{{ url_for('admin_gallery') }}" class="card">
        <div class="card-icon">🖼️</div>
        <h3>照片墙管理</h3>
        <p>上传、删除历史照片</p>
    </a>
    <!-- 以后可以扩展更多管理功能 -->
</div>
{% endblock %}
