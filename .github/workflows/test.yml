name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flask-sqlalchemy

      - name: Set environment variables
        run: |
          echo "SECRET_KEY=test_secret_12345" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///:memory:" >> $GITHUB_ENV
          echo "GROUP_VERIFICATION_CODE=test_group_code" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest -v --tb=short --maxfail=1