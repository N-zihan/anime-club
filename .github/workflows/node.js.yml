name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 设置 Python 环境（Flask 应用需要）
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # 2. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3. 设置 Node.js 环境（Playwright 需要）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 4. 安装 Node.js 依赖（package.json）
      - name: Install Node dependencies
        run: npm ci

      # 5. 安装 Playwright 浏览器
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. 设置环境变量（用于 Flask 测试模式）
      - name: Set test environment variables
        run: |
          echo "TESTING=1" >> $GITHUB_ENV
          echo "GROUP_VERIFICATION_CODE=test_group_code" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///:memory:" >> $GITHUB_ENV
          # Supabase 用 mock，不需要真实 key，但为了不报错，给个占位
          echo "SUPABASE_URL=https://fake.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=fake-key" >> $GITHUB_ENV

      # 7. 运行 Playwright 测试（会自动启动 Flask）
      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
