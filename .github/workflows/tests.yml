name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and capture output
        id: tests
        run: |
          pytest -v --tb=short > test_output.txt 2>&1 || true
          cat test_output.txt

      - name: Parse test results
        id: parse
        run: |
          PASSED=$(grep -oP '\d+ passed' test_output.txt | grep -oP '\d+' || echo "0")
          FAILED=$(grep -oP '\d+ failed' test_output.txt | grep -oP '\d+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          if [ "$FAILED" -eq 0 ]; then
            COLOR="brightgreen"
          else
            COLOR="red"
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Update README badge
        run: |
          PASSED=${{ steps.parse.outputs.passed }}
          TOTAL=${{ steps.parse.outputs.total }}
          COLOR=${{ steps.parse.outputs.color }}
          BADGE_URL="https://img.shields.io/badge/tests-${PASSED}_passing-${COLOR}"
          sed -i "s|https://img.shields.io/badge/tests-.*-.*|${BADGE_URL}|" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update test badge [skip ci]"
          git push